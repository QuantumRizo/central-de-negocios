<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="none">
  <defs>
    <filter id="glass-relief" x="-15%" y="-10%" width="130%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.026" numOctaves="3" seed="21" result="fluidNoise" />
      <feDisplacementMap in="SourceGraphic" in2="fluidNoise" scale="34" xChannelSelector="R" yChannelSelector="G" result="warped" />
      <feGaussianBlur in="warped" stdDeviation="2.5" result="softWarped" />
      <feSpecularLighting in="fluidNoise" surfaceScale="5" specularConstant="0.55" specularExponent="22" lighting-color="#ffffff" result="gloss">
        <feDistantLight azimuth="228" elevation="58" />
      </feSpecularLighting>
      <feComposite in="gloss" in2="warped" operator="in" result="shapedGloss" />
      <feBlend in="softWarped" in2="shapedGloss" mode="screen" />
    </filter>
    <linearGradient id="glassTint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="0.42" stop-color="#e7f1ff" stop-opacity="0.06" />
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="edgeHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.46" />
      <stop offset="1" stop-color="#d9ebff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g filter="url(#glass-relief)">
    <path fill="url(#glassTint)" opacity="0.62" d="M70 -50 C170 90 105 220 210 350 C320 488 178 640 300 950 L470 950 C360 700 500 560 372 402 C255 258 350 110 270 -50 Z" />
    <path fill="url(#glassTint)" opacity="0.46" d="M390 -50 C485 120 400 260 520 405 C635 548 490 710 600 950 L785 950 C685 735 810 560 682 400 C560 248 670 100 588 -50 Z" />
    <path fill="url(#glassTint)" opacity="0.54" d="M760 -50 C865 105 785 250 890 390 C1015 555 865 710 985 950 L1160 950 C1065 730 1190 555 1050 382 C925 225 1030 90 950 -50 Z" />
    <path fill="url(#glassTint)" opacity="0.42" d="M1135 -50 C1250 100 1150 265 1270 410 C1380 545 1240 720 1360 950 L1535 950 C1430 735 1570 540 1435 390 C1300 238 1400 100 1320 -50 Z" />
  </g>

  <g fill="none" stroke="url(#edgeHighlight)" stroke-linecap="round" filter="url(#glass-relief)">
    <path d="M270 -30 C350 120 250 260 370 405 S500 700 470 930" stroke-width="10" opacity="0.42" />
    <path d="M588 -30 C670 120 570 270 690 410 S820 700 785 930" stroke-width="7" opacity="0.34" />
    <path d="M950 -30 C1030 125 930 265 1060 405 S1190 700 1160 930" stroke-width="11" opacity="0.38" />
    <path d="M1320 -30 C1410 120 1305 270 1435 410 S1560 700 1535 930" stroke-width="8" opacity="0.32" />
  </g>
</svg>
