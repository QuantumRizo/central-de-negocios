<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="none">
  <defs>
    <filter id="liquid-distortion" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.018" numOctaves="2" seed="12" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="26" xChannelSelector="R" yChannelSelector="G" />
      <feGaussianBlur stdDeviation="1.8" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" />
    </filter>
    <linearGradient id="highlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="0.45" stop-color="#dceaff" stop-opacity="0.14" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g fill="none" stroke="url(#highlight)" stroke-linecap="round" filter="url(#liquid-distortion)">
    <path d="M-120 690 C 180 250, 290 220, 500 650 S 880 1010, 1080 430 S 1390 40, 1730 300" stroke-width="42" opacity="0.18" />
    <path d="M-100 770 C 180 360, 360 360, 560 710 S 920 1030, 1130 510 S 1430 170, 1710 410" stroke-width="13" opacity="0.3" />
    <path d="M20 190 C 280 520, 410 560, 620 230 S 1010 -100, 1220 280 S 1450 690, 1680 520" stroke-width="28" opacity="0.15" />
    <path d="M-80 430 C 220 80, 420 120, 610 450 S 950 800, 1190 350 S 1430 70, 1710 180" stroke-width="7" opacity="0.34" />
  </g>

  <g fill="none" stroke="#ffffff" stroke-linecap="round" filter="url(#soft-glow)">
    <path d="M-80 430 C 220 80, 420 120, 610 450 S 950 800, 1190 350 S 1430 70, 1710 180" stroke-width="4" opacity="0.34" />
    <path d="M-120 690 C 180 250, 290 220, 500 650 S 880 1010, 1080 430 S 1390 40, 1730 300" stroke-width="8" opacity="0.16" />
  </g>
</svg>
